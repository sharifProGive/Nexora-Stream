name: Build Nexora Stream APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew || true

      - name: Restore fixed debug signing key
        run: base64 -d app/debug.keystore.b64 > app/debug.keystore

      - name: Verify signing key fingerprint
        run: |
          EXPECTED="AF:E4:4B:DC:8F:4F:F7:E9:CE:BD:35:26:C9:B8:ED:6D:C6:88:97:9C"
          ACTUAL=$(keytool -list -v -keystore app/debug.keystore -storepass android 2>/dev/null | grep "SHA1:" | head -n 1 | awk '{print $2}')
          echo "Keystore SHA-1: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Signing key does not match the key registered in Google Cloud. Re-paste app/debug.keystore.b64."
            exit 1
          fi

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug

      - name: Rename APK Artifact
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} artifacts/Nexora-Stream-v1.0.apk \;

      - name: Upload Nexora Stream APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Stream-v1.0.apk
          path: artifacts/Nexora-Stream-v1.0.apk
          retention-days: 30
