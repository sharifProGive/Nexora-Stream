name: Build Nexora Stream APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug

      - name: Rename APK Artifact
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} artifacts/Nexora-Stream-v1.0.apk \;

      - name: Upload Nexora Stream APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Stream-v1.0.apk
          path: artifacts/Nexora-Stream-v1.0.apk
          retention-days: 30
